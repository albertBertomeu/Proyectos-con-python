<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Pendientes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abel&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
          rel="stylesheet">
    <style>
        body{
           background-color:#F2C8BF;
           font-family : 'Abel', sans-serif;
           padding-top: 60px;
           }
          .container{
              max-width:550px;
              margin: auto;
              background-color: #BD988F;
              -webkit-box-shadow: 2px 2px 13px -4px rgba(0,0,0,0.21);
              box-shadow:2px 2px 13px -4px rgba(0,0,0,0.21);
          }
          h1,
          h2,
          h3,
          h4,
          h5,
          h6 {
              font-family: "Lato", sans-serif;
               }
          a,
          p {
         color: #4D2D2D;
          }
        .barra-superior{
            display:flex;
            justify-content:space-between;
            color: #ffffff;
            padding: 10 px;
            border-radius: 5px 5px 0 0 ;
            background:linear-gradient(90deg, #54DCFF 0%,#2C95E6 43%,#2C95E6 100%);
        }
        .barra-superior a {
          color:#ffffff;
          text-decoration:none;
        }
        .envoltorio-tarea{
             display: flex;
             align-items:center;
             justify-content: space-between;
             padding: 20px;
             background-color: #ffffff;
             border-top: 1px solid rgb(225,225,225);
          }
        .titulo-tarea{
        display:flex;
        }
        .titulo-tarea a{
            text-decoration : none;
            color: #4b5156;
            margin-left: 10px;
        }
        .icono-tarea-completa{
            heigh: 20px;
            width:20px;
            background-color: rgb(105,162,105);
            border-radius: 50px;
        }
        .icono-tarea-incompleta{
            heigh: 20px;
            width:20px;
            background-color: rgb(218,218,218);
            border-radius: 50px;
        }
        .enlace-eliminar{
          text-decoration : none;
          font-weigh: 900;
          color: #EA4220;
          font-size: 22px;
          line-heigh:0;
        }
        #envoltorio-agregar-buscar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;

        }
        #enlace-agregar{
            color: #EA4220;
            text-decoration : none;
            font-size: 42px;
            text-shadow: 1px 1px #814138;

        }
        input[type=text],
        input[type=password],
        textarea {
            border: 1px solid #EB796F;
            border-radius: 5px;
            padding: 10px;
            width: 90%;
        }

        label {
            padding-top: 10px !important;
            display: block;
        }

        .boton {
            border: 1px solid #EB796F;
            background-color: #FAFAFA;
            color: #EB796F;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }

        .cuerpo-tarjeta {
            padding: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    {% block content%}
    {% endblock content%}
</div>
</body>
</html>
